<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AaryaVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; 
            background: url('bg5.png') no-repeat center center fixed; 
            background-size: cover; 
            font-family: 'Poppins', sans-serif; overflow: hidden; 
        }

        /* Glass hata diya, ab sirf clean text hai */
        .section { text-align: center; display: none; width: 90%; max-width: 400px; }
        #unlock-section { display: block; }

        h1 { color: #fff; font-size: 2rem; margin-bottom: 15px; font-family: 'Dancing Script', cursive; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        p { color: #fff; font-size: 1.1rem; margin-bottom: 25px; text-shadow: 0 1px 5px rgba(0,0,0,0.5); }
        
        input { 
            width: 80%; padding: 15px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50px; 
            font-size: 1rem; text-align: center; background: rgba(0,0,0,0.2); color: white;
        }
        button { 
            width: 100%; padding: 15px; margin-top: 20px; background: #ec407a; 
            color: white; border: none; border-radius: 50px; font-size: 1.2rem; 
            font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(236, 64, 122, 0.4);
        }
        
        /* Floating Flowers */
        .petal { position: absolute; top: -10%; font-size: 24px; animation: fall linear infinite; z-index: 1; pointer-events: none; opacity: 0.8; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        /* Grand Title */
        #title { color: #fff; font-size: 4.5rem; font-family: 'Dancing Script', cursive; text-shadow: 0 0 25px #ec407a, 0 0 10px rgba(0,0,0,0.5); white-space: nowrap; }
        .letter { display: inline-block; opacity: 0; animation: fadeInLetter 0.7s forwards; }
        @keyframes fadeInLetter { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="unlock-section" class="section">
        <h1>🔒 Locked</h1>
        <p>Hint - The Day Our Story Began </p>
        <input type="date" id="dateInput">
        <button onclick="checkDate()">Unlock</button>
        <p id="msg" style="color: #ff80ab; font-size: 0.9rem; margin-top: 15px;"></p>
    </div>

    <div id="loader-section" class="section">
        <h1 style="font-size: 2rem;">Loading... ✨</h1>
    </div>

    <div id="intro-section" class="section">
        <div id="title"></div>
    </div>

    <script>
        // Flowers Animation
        for(let i=0; i<12; i++) {
            let p = document.createElement('div'); p.className = 'petal'; p.innerHTML = '🌸';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 15 + 15) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            document.body.appendChild(p);
        }

        function checkDate() {
            if (document.getElementById('dateInput').value === '2026-05-29') {
                document.getElementById('unlock-section').style.display = 'none';
                document.getElementById('loader-section').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('loader-section').style.display = 'none';
                    document.getElementById('intro-section').style.display = 'block';
                    playIntro();
                }, 2000);
            } else {
                document.getElementById('msg').innerText = "Oops! Galat date hai... phir se try karo 🙈";
            }
        }

        function playIntro() {
            const text = "AaryaVerse";
            const titleDiv = document.getElementById('title');
            text.split('').forEach((char, index) => {
                const span = document.createElement('span');
                span.textContent = char; span.className = 'letter';
                span.style.animationDelay = (index * 0.2) + 's';
                titleDiv.appendChild(span);
            });
            setTimeout(() => { window.location.href = "man.html"; }, 4500);
        }
    </script>
</body>
</html>
